services:
  web-automatico:
    build: .
    ports:
      - "8083:80"
    networks:
      - default
    depends_on:
      - database-santo
    environment:
      - DB_HOST=database-santo
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-mio_database}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD}
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_TOKEN_SECRET=${APP_TOKEN_SECRET:-}
      - APP_FRONTEND_URL=${APP_FRONTEND_URL:-http://localhost:4200}
      - PLAN_MONTHLY_PRICE=${PLAN_MONTHLY_PRICE:-4.99}
      - PLAN_YEARLY_PRICE=${PLAN_YEARLY_PRICE:-49.99}
      - PAYMENT_CURRENCY=${PAYMENT_CURRENCY:-EUR}
      - ADMIN_INITIAL_PASSWORD=${ADMIN_INITIAL_PASSWORD:-}
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID:-}
      - PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET:-}
      - PAYPAL_MODE=${PAYPAL_MODE:-sandbox}
      - PAYPAL_CURRENCY=${PAYPAL_CURRENCY:-EUR}
      - PAYPAL_PRICE_MONTHLY=${PAYPAL_PRICE_MONTHLY:-4.99}
      - PAYPAL_PRICE_YEARLY=${PAYPAL_PRICE_YEARLY:-49.99}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
    restart: unless-stopped

  database-santo:
    image: mariadb:latest
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-mio_database}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      timeout: 20s
      retries: 10

  dashboard-db:
    image: adminer:latest
    restart: always
    ports:
      - "8082:8080"
    depends_on:
      - database-santo

  monitoraggio:
    image: portainer/portainer-ce:latest
    restart: always
    ports:
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

volumes:
  portainer_data:
  db_data: