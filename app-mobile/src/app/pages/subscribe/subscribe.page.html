<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        <ion-icon name="arrow-back"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>{{ 'subscribe.title' | translate }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="subscribe-content">
  <div class="subscribe-container">

    <div class="logo-area">SR</div>

    <h2 class="title">{{ 'subscribe.title' | translate }}</h2>
    <div class="plan-badge">{{ planPrice }}</div>

    <ion-button
      expand="block"
      class="btn-activate"
      (click)="confirmPayment()"
    >
      {{ 'subscribe.activate' | translate }}
    </ion-button>

    <ion-button
      fill="clear"
      expand="block"
      class="btn-back"
      (click)="goBack()"
    >
      {{ 'subscribe.back' | translate }}
    </ion-button>

  </div>
</ion-content>
